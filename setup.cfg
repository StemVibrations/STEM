[metadata]
name = STEM-Vibrations
version = attr: stem.__version__
url = https://github.com/StemVibrations/STEM
author = STEM team
description = STEM model
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    License :: OSI Approved :: BSD License
    Operating System :: Microsoft :: Windows
    Operating System :: Unix
[options]
packages =
    stem
    stem.IO
include_package_data = True
install_requires =
    numpy>=2.3.5
    scipy>=1.16.2
    plotly>=5.24.1
    gmsh_utils @ git+https://github.com/StemVibrations/gmsh_utils@update_python_version
    random_fields @ git+https://github.com/StemVibrations/RandomFields@update_python_support
    StemKratos @ git+https://github.com/StemVibrations/Kratos@update_python_version
    UVEC @ git+https://github.com/StemVibrations/vehicle_models@update_python_versions
python_requires = >=3.12, <3.15

[options.extras_require]
testing =
    pytest==7.4.2
    pytest-cov>=6.0
    tox>=4.23
    mypy>=1.13
    pre-commit==3.6.2
    yapf==0.43.0
    flake8==7.0.0
    beautifulsoup4>=4.12
    matplotlib>=3.10.9
docs =
    Sphinx==7.4.7
    sphinx-rtd-theme==3.0.2
    sphinxcontrib-bibtex==2.6.3

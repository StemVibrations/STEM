[tox]
minversion = 3.10.0
envlist = py312, py313, py314
isolated_build = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314


[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    py312: pre-commit run --all-files
    pytest --basetemp={envtmpdir}